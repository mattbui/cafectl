name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test
      - run: swift build --configuration release
      - run: .build/release/cafectl --help
      - run: ruby -c Formula/cafectl.rb && ruby -c scripts/update-formula.rb
      - run: ruby scripts/tests/update-formula-test.rb
